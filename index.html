<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Referências Conceituais</title>

  <style>
    :root {
      --bg: #191919;
      --gold: #d6b25e;
      --muted: #cfcfcf;
      --line: rgba(255,255,255,.10);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: #191919 !important;
      overflow: hidden;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #fff;
    }

    .wrap {
      max-width: 1080px;
      margin: auto;
      padding: 16px 10px;
      background: #191919;
    }

    .shell {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: #191919;
    }

    .track {
      display: flex;
      transition: .4s transform;
    }

    .slide {
      min-width: 100%;
      padding: 30px 42px 24px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1.1fr .9fr;
      gap: 22px;
      align-items: center;
    }

    .main {
      border: 1px solid rgba(214,178,94,.30);
      background: linear-gradient(135deg, rgba(214,178,94,.13), rgba(255,255,255,.035));
      border-radius: 20px;
      padding: 24px;
    }

    .tag {
      display: inline-block;
      margin: 0 0 12px;
      padding: 7px 11px;
      border: 1px solid rgba(214,178,94,.35);
      border-radius: 999px;
      background: rgba(214,178,94,.13);
      color: #f4d98c;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    h2 {
      margin: 0 0 12px;
      font-size: clamp(28px, 4vw, 46px);
      line-height: 1.04;
      letter-spacing: -.04em;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: clamp(16px, 1.8vw, 20px);
      line-height: 1.52;
    }

    .side {
      display: grid;
      gap: 12px;
    }

    .chip {
      width: max-content;
      max-width: 100%;
      padding: 7px 11px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: #aaa;
      background: rgba(255,255,255,.04);
      font-size: 12px;
    }

    .chip b {
      color: #d4d4d4;
    }

    .box {
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255,255,255,.045);
      padding: 15px;
    }

    .box b {
      display: block;
      color: #f1cf78;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .03em;
      margin-bottom: 6px;
    }

    .box p {
      font-size: 15px;
      line-height: 1.45;
    }

    .note {
      color: #999;
      font-size: 12px;
      line-height: 1.4;
      border-top: 1px solid var(--line);
      padding-top: 10px;
    }

    .btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: rgba(17,17,17,.76);
      color: #fff;
      font-size: 25px;
      cursor: pointer;
      display: grid;
      place-items: center;
      z-index: 5;
    }

    .prev {
      left: 10px;
    }

    .next {
      right: 10px;
    }

    .foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 42px 20px;
    }

    .dots {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }

    .dot {
      width: 8px;
      height: 8px;
      border: 0;
      border-radius: 99px;
      background: rgba(255,255,255,.25);
      cursor: pointer;
      padding: 0;
    }

    .dot.on {
      width: 26px;
      background: var(--gold);
    }

    .count {
      font-size: 13px;
      color: #999;
      white-space: nowrap;
    }

    @media (max-width: 760px) {
      .wrap {
        padding: 8px 6px;
      }

      .slide {
        padding: 18px 14px 14px;
      }

      .grid {
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .main {
        padding: 16px;
        border-radius: 17px;
      }

      .tag {
        font-size: 10px;
        padding: 6px 9px;
      }

      h2 {
        font-size: clamp(27px, 8vw, 38px);
      }

      p {
        font-size: 15px;
        line-height: 1.42;
      }

      .box {
        padding: 12px;
      }

      .box p {
        font-size: 13.5px;
      }

      .note {
        font-size: 10.5px;
      }

      .btn {
        width: 36px;
        height: 36px;
        font-size: 23px;
      }

      .prev {
        left: 5px;
      }

      .next {
        right: 5px;
      }

      .foot {
        padding: 0 14px 12px;
      }

      .dot {
        width: 7px;
        height: 7px;
      }

      .dot.on {
        width: 22px;
      }
    }
  </style>
</head>

<body>
  <main class="wrap">
    <section class="shell">
      <div class="track" id="track"></div>

      <button class="btn prev" id="prev" type="button" aria-label="Referência anterior">‹</button>
      <button class="btn next" id="next" type="button" aria-label="Próxima referência">›</button>

      <div class="foot">
        <div class="dots" id="dots"></div>
        <div class="count" id="count"></div>
      </div>
    </section>
  </main>

  <script>
    const refs = [
      [
        "James Clear",
        "Pequenas melhorias diárias, identidade e construção de hábitos.",
        "Aplicado como método para sair do excesso de intenção e construir consistência por meio de ações simples repetidas.",
        "Citado como fonte de produção e pesquisa."
      ],
      [
        "Dave Brailsford",
        "Ganhos marginais: melhorar pequenos detalhes até gerar resultado extraordinário.",
        "Reforça a lógica de evolução progressiva, onde pequenas decisões acumuladas mudam o desempenho.",
        "Citado como fonte de produção e pesquisa."
      ],
      [
        "Mel Robbins",
        "Romper a hesitação e agir antes que a mente racionalize a desistência.",
        "Conecta-se à procrastinação, primeiro passo, ação rápida e execução antes da motivação aparecer.",
        "Princípios alinhados ao conteúdo."
      ],
      [
        "Tim Ferriss",
        "Foco, eliminação, clareza e ação estratégica.",
        "Aplicado na redução de distrações, escolha do que importa e execução com prioridade.",
        "Citado como fonte de produção e pesquisa."
      ],
      [
        "Brené Brown",
        "Vulnerabilidade, coragem, conexão e liderança humana.",
        "Aparece na construção de uma liderança consciente, madura e menos baseada em aparência.",
        "Citada como fonte de produção e pesquisa."
      ],
      [
        "Eric Ries",
        "Mentalidade enxuta, MVP, validação e aprendizado rápido.",
        "Mostra como testar ideias, medir respostas e ajustar ações antes de desperdiçar energia.",
        "Citado como fonte de produção e pesquisa."
      ],
      [
        "Drew Houston",
        "Validação prática, foco no usuário e aprendizado antes de escalar.",
        "Conecta-se à ideia de transformar planos em experimentos e validar antes de investir demais.",
        "Princípios alinhados ao conteúdo."
      ],
      [
        "Brian Chesky",
        "Criatividade sob pressão, persistência e execução em ambiente incerto.",
        "Reforça a importância de agir com recursos limitados, testar caminhos e adaptar a estratégia.",
        "Princípios alinhados ao conteúdo."
      ],
      [
        "Sara Blakely",
        "Ressignificação do fracasso, coragem para tentar e melhoria contínua.",
        "Apoia a visão de que falhas fazem parte do processo de execução, ajuste e crescimento.",
        "Princípios alinhados ao conteúdo."
      ],
      [
        "Jia Jiang",
        "Exposição ao desconforto, resiliência emocional e treino contra o medo.",
        "Conecta-se ao domínio emocional, ação apesar do medo e transformação do desconforto em aprendizado.",
        "Princípios alinhados ao conteúdo."
      ],
      [
        "Matt Cutts",
        "Desafios curtos, ciclos de execução e formação de hábitos.",
        "Relaciona-se ao plano prático de aplicação, aos ciclos de ação e à construção de consistência.",
        "Princípios alinhados ao conteúdo."
      ]
    ];

    const tr = document.getElementById("track");
    const ds = document.getElementById("dots");
    const ct = document.getElementById("count");

    let i = 0;

    refs.forEach((r, n) => {
      tr.innerHTML += `
        <article class="slide">
          <div class="grid">
            <div class="main">
              <span class="tag">Princípio aplicado no Manual</span>
              <h2>${r[1]}</h2>
              <p>${r[2]}</p>
            </div>

            <div class="side">
              <div class="chip">
                Referência conceitual: <b>${r[0]}</b>
              </div>

              <div class="box">
                <b>Status no material</b>
                <p>${r[3]}</p>
              </div>

              <div class="box">
                <b>Como ler esta seção</b>
                <p>Esta referência não substitui o método do Manual. Ela apenas mostra a base conceitual usada para organizar um caminho prático de execução.</p>
              </div>

              <div class="note">
                O foco não está na biografia dos autores, mas nos princípios aplicados ao Código da Alta Performance.
              </div>
            </div>
          </div>
        </article>
      `;

      const b = document.createElement("button");
      b.className = "dot";
      b.type = "button";
      b.setAttribute("aria-label", `Ir para referência ${n + 1}`);
      b.onclick = () => go(n);
      ds.appendChild(b);
    });

    function up() {
      tr.style.transform = `translateX(-${i * 100}%)`;

      [...ds.children].forEach((d, n) => {
        d.classList.toggle("on", n === i);
      });

      ct.textContent = `${i + 1} / ${refs.length}`;
    }

    function go(n) {
      i = (n + refs.length) % refs.length;
      up();
    }

    document.getElementById("prev").onclick = () => go(i - 1);
    document.getElementById("next").onclick = () => go(i + 1);

    let sx = 0;

    tr.addEventListener("touchstart", e => {
      sx = e.changedTouches[0].screenX;
    }, { passive: true });

    tr.addEventListener("touchend", e => {
      const dx = sx - e.changedTouches[0].screenX;

      if (Math.abs(dx) > 45) {
        go(i + (dx > 0 ? 1 : -1));
      }
    }, { passive: true });

    up();
  </script>
</body>
</html>
