<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carrossel de Testemunhos</title>
  <style>
    :root {
      --bg: #111111;
      --card: #191919;
      --card-2: #222222;
      --text: #ffffff;
      --muted: #cfcfcf;
      --gold: #d6b25e;
      --gold-soft: rgba(214, 178, 94, 0.18);
      --border: rgba(255, 255, 255, 0.10);
      --shadow: 0 22px 60px rgba(0, 0, 0, 0.35);
      --radius: 28px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: var(--bg);
      overflow: hidden;
    }

    body {
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
    }

    .carousel-widget {
      width: 100%;
      max-width: 1120px;
      height: 100vh;
      margin: 0 auto;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .carousel-shell {
      position: relative;
      width: 100%;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background:
        radial-gradient(circle at top left, rgba(214, 178, 94, 0.16), transparent 34%),
        linear-gradient(145deg, var(--card), var(--bg));
      box-shadow: var(--shadow);
    }

    .carousel-track {
      display: flex;
      transition: transform 420ms ease;
      will-change: transform;
    }

    .carousel-slide {
      min-width: 100%;
      display: grid;
      grid-template-columns: minmax(230px, 38%) 1fr;
      gap: 26px;
      align-items: stretch;
      padding: 28px 34px 24px;
    }

    .photo-wrap {
      position: relative;
      min-height: 330px;
      border-radius: 24px;
      overflow: hidden;
      background: linear-gradient(135deg, #2a2a2a, #111111);
      border: 1px solid var(--border);
    }

    .photo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: saturate(0.92) contrast(1.04);
    }

    .photo-fallback {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 22px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
      background:
        linear-gradient(135deg, rgba(255,255,255,0.04), transparent),
        #171717;
    }

    .content {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 330px;
    }

    .eyebrow {
      width: fit-content;
      margin: 0 0 14px;
      padding: 7px 11px;
      border: 1px solid rgba(214, 178, 94, 0.35);
      border-radius: 999px;
      background: var(--gold-soft);
      color: #f4d98c;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h2 {
      margin: 0 0 14px;
      font-size: clamp(30px, 5vw, 50px);
      line-height: 0.98;
      letter-spacing: -0.055em;
    }

    .section {
      margin-top: 14px;
      padding: 16px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.045);
      border: 1px solid var(--border);
    }

    .section strong {
      display: block;
      margin-bottom: 8px;
      color: #f1cf78;
      font-size: 14px;
      letter-spacing: 0.02em;
    }

    .section p {
      margin: 0;
      color: var(--muted);
      font-size: clamp(15px, 2vw, 18px);
      line-height: 1.58;
    }

    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 5;
      width: 46px;
      height: 46px;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: rgba(17, 17, 17, 0.72);
      color: white;
      cursor: pointer;
      display: grid;
      place-items: center;
      font-size: 26px;
      line-height: 1;
      backdrop-filter: blur(10px);
      transition: transform 180ms ease, background 180ms ease, border-color 180ms ease;
    }

    .nav-btn:hover {
      transform: translateY(-50%) scale(1.05);
      background: rgba(214, 178, 94, 0.20);
      border-color: rgba(214, 178, 94, 0.50);
    }

    .prev { left: 18px; }
    .next { right: 18px; }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 0 34px 22px;
    }

    .dots {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .dot {
      width: 9px;
      height: 9px;
      border: 0;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.25);
      cursor: pointer;
      padding: 0;
      transition: width 220ms ease, background 220ms ease;
    }

    .dot.active {
      width: 28px;
      background: var(--gold);
    }

    .counter {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    @media (max-height: 560px) and (min-width: 761px) {
      .carousel-widget {
        padding: 8px;
      }

      .carousel-slide {
        padding: 22px 30px 18px;
      }

      .photo-wrap,
      .content {
        min-height: 290px;
      }

      .eyebrow {
        margin-bottom: 10px;
        padding: 6px 10px;
      }

      h2 {
        margin-bottom: 10px;
        font-size: clamp(28px, 4.4vw, 44px);
      }

      .section {
        margin-top: 10px;
        padding: 13px 15px;
      }

      .section p {
        font-size: 16px;
        line-height: 1.45;
      }

      .footer {
        padding-bottom: 16px;
      }
    }

    @media (max-width: 760px) {
      .carousel-widget {
        padding: 10px;
      }

      .carousel-slide {
        grid-template-columns: 1fr;
        gap: 18px;
        padding: 24px 20px 26px;
      }

      .photo-wrap {
        min-height: 310px;
      }

      .content {
        min-height: auto;
      }

      .nav-btn {
        top: 230px;
        width: 42px;
        height: 42px;
      }

      .prev { left: 12px; }
      .next { right: 12px; }

      .footer {
        padding: 0 20px 24px;
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <main class="carousel-widget" aria-label="Carrossel de testemunhos">
    <section class="carousel-shell">
      <div class="carousel-track" id="carouselTrack"></div>

      <button class="nav-btn prev" type="button" aria-label="Anterior" id="prevBtn">‹</button>
      <button class="nav-btn next" type="button" aria-label="Próximo" id="nextBtn">›</button>

      <div class="footer">
        <div class="dots" id="dots" aria-label="Navegação do carrossel"></div>
        <div class="counter" id="counter"></div>
      </div>
    </section>
  </main>

  <script>
    const testemunhos = [
  {
    "nome": "James Clear",
    "imagem": "https://raw.githubusercontent.com/hasneto/CodigoAltaPerformance/main/james-clear.jpg",
    "principio": "Hábitos pequenos, melhoria contínua e “1% melhor por dia”.",
    "testemunho": "James Clear relata sua trajetória ligada aos hábitos, à tomada de decisão e à melhoria contínua. Também há registros sobre sua superação após uma lesão séria."
  },
  {
    "nome": "Dave Brailsford",
    "imagem": "https://raw.githubusercontent.com/hasneto/CodigoAltaPerformance/main/dave-brailsford.jpg",
    "principio": "Agregação de ganhos marginais, ou seja, melhorar pequenos detalhes até gerar grande resultado.",
    "testemunho": "O caso da British Cycling mostra como pequenas melhorias acumuladas foram aplicadas para alcançar desempenho de elite."
  },
  {
    "nome": "Mel Robbins",
    "imagem": "https://raw.githubusercontent.com/hasneto/CodigoAltaPerformance/main/mel-robbins.jpg",
    "principio": "Romper a procrastinação e agir antes que o cérebro racionalize a desistência.",
    "testemunho": "Em sua palestra no TED, Mel Robbins apresenta a lógica de sair do piloto automático e agir rapidamente para quebrar padrões de hesitação."
  },
  {
    "nome": "Tim Ferriss",
    "imagem": "https://raw.githubusercontent.com/hasneto/CodigoAltaPerformance/main/tim-ferriss.png",
    "principio": "Clareza, eliminação, controle do medo e ação estratégica.",
    "testemunho": "No exercício “Fear-Setting”, Tim Ferriss explica como lida com decisões difíceis, medo, risco e paralisia."
  },
  {
    "nome": "Brené Brown",
    "imagem": "https://raw.githubusercontent.com/hasneto/CodigoAltaPerformance/main/brene-brown.jpg",
    "principio": "Vulnerabilidade como base de coragem, conexão e liderança humana.",
    "testemunho": "Na palestra “The Power of Vulnerability”, Brené Brown compartilha como sua pesquisa a conduziu a uma jornada pessoal sobre vulnerabilidade e conexão."
  },
  {
    "nome": "Eric Ries",
    "imagem": "https://raw.githubusercontent.com/hasneto/CodigoAltaPerformance/main/eric-ries.jpg",
    "principio": "Mentalidade enxuta, startup como experimento, construir, medir e aprender.",
    "testemunho": "Em sua palestra sobre Lean Startup, Eric Ries explica a importância de tratar produtos, campanhas e recursos como experimentos para aprender rapidamente."
  },
  {
    "nome": "Drew Houston",
    "imagem": "https://raw.githubusercontent.com/hasneto/CodigoAltaPerformance/main/drew-houston.jpg",
    "principio": "MVP, validação antes de escalar, foco no usuário e aprendizagem rápida.",
    "testemunho": "O fundador do Dropbox contou como aplicou princípios de Lean Startup usando feedback, vídeo demonstrativo e crescimento sem depender de marketing tradicional pesado."
  },
  {
    "nome": "Brian Chesky",
    "imagem": "https://raw.githubusercontent.com/hasneto/CodigoAltaPerformance/main/brian-chesky.png",
    "principio": "Persistência, criatividade sob pressão, validação e execução em ambiente incerto.",
    "testemunho": "A história do Airbnb vendendo caixas de cereal para sobreviver e chamar atenção de investidores é um exemplo de execução criativa diante da escassez."
  },
  {
    "nome": "Sara Blakely",
    "imagem": "https://raw.githubusercontent.com/hasneto/CodigoAltaPerformance/main/sara-blakely.jpg",
    "principio": "Ressignificação do fracasso, coragem para tentar e persistência empreendedora.",
    "testemunho": "Em entrevistas, Sara Blakely relata como aprendeu desde cedo a enxergar o fracasso como tentativa e crescimento, e não como derrota final."
  },
  {
    "nome": "Jia Jiang",
    "imagem": "https://raw.githubusercontent.com/hasneto/CodigoAltaPerformance/main/jia-jiang.jpg",
    "principio": "Prática deliberada contra o medo, exposição ao desconforto e resiliência emocional.",
    "testemunho": "Jia Jiang documentou a jornada “100 Days of Rejection”, buscando rejeições por 100 dias para dessensibilizar o medo e transformar rejeição em aprendizado."
  },
  {
    "nome": "Matt Cutts",
    "imagem": "https://raw.githubusercontent.com/hasneto/CodigoAltaPerformance/main/matt-cutts.jpg",
    "principio": "Desafio prático de curto prazo, formação de hábito e execução por ciclos.",
    "testemunho": "Na palestra “Try something new for 30 days”, Matt Cutts relata como desafios de 30 dias ajudam a sair da inércia e construir novas experiências."
  }
];

    const track = document.getElementById("carouselTrack");
    const dots = document.getElementById("dots");
    const counter = document.getElementById("counter");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");

    let currentIndex = 0;

    function createSlide(item, index) {
      const slide = document.createElement("article");
      slide.className = "carousel-slide";
      slide.setAttribute("aria-hidden", index === 0 ? "false" : "true");

      slide.innerHTML = `
        <div class="photo-wrap">
          <img src="${item.imagem}" alt="Foto de ${item.nome}" loading="lazy" onerror="this.style.display='none'; this.nextElementSibling.style.display='grid';">
          <div class="photo-fallback" style="display:none;">
            Envie a imagem para o GitHub e ajuste o caminho:<br><strong>${item.imagem}</strong>
          </div>
        </div>

        <div class="content">
          <p class="eyebrow">Testemunho de alta performance</p>
          <h2>${item.nome}</h2>

          <div class="section">
            <strong>Princípio presentes no ebook</strong>
            <p>${item.principio}</p>
          </div>

          <div class="section">
            <strong>Seu testemunho</strong>
            <p>${item.testemunho}</p>
          </div>
        </div>
      `;

      return slide;
    }

    function renderCarousel() {
      testemunhos.forEach((item, index) => {
        track.appendChild(createSlide(item, index));

        const dot = document.createElement("button");
        dot.className = index === 0 ? "dot active" : "dot";
        dot.type = "button";
        dot.setAttribute("aria-label", `Ir para o slide ${index + 1}`);
        dot.addEventListener("click", () => goToSlide(index));
        dots.appendChild(dot);
      });

      updateCarousel();
    }

    function updateCarousel() {
      track.style.transform = `translateX(-${currentIndex * 100}%)`;

      [...track.children].forEach((slide, index) => {
        slide.setAttribute("aria-hidden", index === currentIndex ? "false" : "true");
      });

      [...dots.children].forEach((dot, index) => {
        dot.classList.toggle("active", index === currentIndex);
      });

      counter.textContent = `${currentIndex + 1} / ${testemunhos.length}`;
    }

    function goToSlide(index) {
      currentIndex = (index + testemunhos.length) % testemunhos.length;
      updateCarousel();
    }

    prevBtn.addEventListener("click", () => goToSlide(currentIndex - 1));
    nextBtn.addEventListener("click", () => goToSlide(currentIndex + 1));

    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowLeft") goToSlide(currentIndex - 1);
      if (event.key === "ArrowRight") goToSlide(currentIndex + 1);
    });

    let touchStartX = 0;
    let touchEndX = 0;

    track.addEventListener("touchstart", (event) => {
      touchStartX = event.changedTouches[0].screenX;
    }, { passive: true });

    track.addEventListener("touchend", (event) => {
      touchEndX = event.changedTouches[0].screenX;
      const diff = touchStartX - touchEndX;

      if (Math.abs(diff) > 45) {
        if (diff > 0) goToSlide(currentIndex + 1);
        else goToSlide(currentIndex - 1);
      }
    }, { passive: true });

    renderCarousel();
  </script>
</body>
</html>
