<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carrossel de Testemunhos</title>
  <style>
    :root {
      --bg: #191919;
      --card: #191919;
      --card-2: #222222;
      --text: #ffffff;
      --muted: #cfcfcf;
      --gold: #d6b25e;
      --gold-soft: rgba(214, 178, 94, 0.18);
      --border: rgba(255, 255, 255, 0.10);
      --shadow: none;
      --radius: 28px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #191919 !important;
      overflow: hidden;
    }

    body {
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
    }

    .carousel-widget {
      background: #191919 !important;
      width: 100%;
      max-width: 1120px;
      height: 100vh;
      margin: 0 auto;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .carousel-shell {
      position: relative;
      width: 100%;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: #191919;
      box-shadow: none;
    }

    .carousel-track {
      display: flex;
      transition: transform 420ms ease;
      will-change: transform;
    }

    .carousel-slide {
      min-width: 100%;
      display: grid;
      grid-template-columns: minmax(230px, 38%) 1fr;
      gap: 26px;
      align-items: stretch;
      padding: 28px 34px 24px;
    }

    .photo-wrap {
      position: relative;
      min-height: 330px;
      border-radius: 24px;
      overflow: hidden;
      background: #191919;
      border: 1px solid var(--border);
    }

    .photo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: saturate(0.92) contrast(1.04);
    }

    .photo-fallback {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 22px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
      background: #191919;
    }

    .content {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 330px;
    }

    .eyebrow {
      width: fit-content;
      margin: 0 0 14px;
      padding: 7px 11px;
      border: 1px solid rgba(214, 178, 94, 0.35);
      border-radius: 999px;
      background: var(--gold-soft);
      color: #f4d98c;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h2 {
      margin: 0 0 14px;
      font-size: clamp(30px, 5vw, 50px);
      line-height: 0.98;
      letter-spacing: -0.055em;
    }

    .section {
      margin-top: 14px;
      padding: 16px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.045);
      border: 1px solid var(--border);
    }

    .section strong {
      display: block;
      margin-bottom: 8px;
      color: #f1cf78;
      font-size: 14px;
      letter-spacing: 0.02em;
    }

    .section p {
      margin: 0;
      color: var(--muted);
      font-size: clamp(15px, 2vw, 18px);
      line-height: 1.58;
    }

    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 5;
      width: 46px;
      height: 46px;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: rgba(17, 17, 17, 0.72);
      color: white;
      cursor: pointer;
      display: grid;
      place-items: center;
      font-size: 26px;
      line-height: 1;
      backdrop-filter: blur(10px);
      transition: transform 180ms ease, background 180ms ease, border-color 180ms ease;
    }

    .nav-btn:hover {
      transform: translateY(-50%) scale(1.05);
      background: rgba(214, 178, 94, 0.20);
      border-color: rgba(214, 178, 94, 0.50);
    }

    .prev { left: 18px; }
    .next { right: 18px; }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 0 34px 22px;
    }

    .dots {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .dot {
      width: 9px;
      height: 9px;
      border: 0;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.25);
      cursor: pointer;
      padding: 0;
      transition: width 220ms ease, background 220ms ease;
    }

    .dot.active {
      width: 28px;
      background: var(--gold);
    }

    .counter {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    @media (max-height: 560px) and (min-width: 761px) {
      .carousel-widget {
        padding: 8px;
      }

      .carousel-slide {

      }

      }

      .nav-btn {

      background: rgba(214, 178, 94, 0.075);

    .relation-btn:hover {

    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(0, 0, 0, 0.68);
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      width: min(760px, 100%);
      max-height: min(82vh, 680px);
      overflow: auto;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 24px;
      background: #1f1f1f;
      box-shadow: 0 26px 80px rgba(0, 0, 0, 0.46);
      padding: 24px;
    }

    .modal-card h3 {
      margin: 0 0 10px;

    }

    .modal-card strong {
      display: block;

    }

    .modal-card p {
      margin: 0;

    .modal-close {

      cursor: pointer;
    }

    @media (max-width: 560px) {

        margin-top: 7px !important;

<body>
  <main class="carousel-widget" aria-label="Carrossel de testemunhos">
    <section class="carousel-shell">
      <div class="carousel-track" id="carouselTrack"></div>

      <button class="nav-btn prev" type="button" aria-label="Anterior" id="prevBtn">‹</button>
      <button class="nav-btn next" type="button" aria-label="Próximo" id="nextBtn">›</button>

      <div class="footer">
        <div class="dots" id="dots" aria-label="Navegação do carrossel"></div>
        <div class="counter" id="counter"></div>
      </div>
    </section>
  </main>

  <div class="modal-backdrop" id="relationModal" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h3 id="modalTitle"></h3>
      <strong>Relação com o ebook</strong>
      <p id="modalText"></p>
      <button class="modal-close" type="button" id="modalClose">Fechar</button>
    </div>
  </div>

    const track = document.getElementById("carouselTrack");
    const dots = document.getElementById("dots");
    const counter = document.getElementById("counter");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const relationModal = document.getElementById("relationModal");
    const modalTitle = document.getElementById("modalTitle");
    const modalText = document.getElementById("modalText");
    const modalClose = document.getElementById("modalClose");

    let currentIndex = 0;

    function createSlide(item, index) {
      const slide = document.createElement("article");
      slide.className = "carousel-slide";
      slide.setAttribute("aria-hidden", index === 0 ? "false" : "true");

      slide.innerHTML = `
        <div class="photo-wrap">
          <img src="${item.imagem}" alt="Foto de ${item.nome}" loading="lazy" onerror="this.style.display='none'; this.nextElementSibling.style.display='grid';">
          <div class="photo-fallback" style="display:none;">
            Envie a imagem para o GitHub e ajuste o caminho:<br><strong>${item.imagem}</strong>
          </div>
        </div>

        <div class="content">
          <p class="eyebrow">REFERÊNCIAS QUE NOS INSPIRAM</p>
          <h2>${item.nome}</h2>

          <div class="section">
            <strong>Princípio presente no ebook</strong>
            <p>${item.principio}</p>
          </div>

          <div class="section status-section">
            <strong>Status no ebook</strong>
            <p>${item.status}</p>
          </div>

          <div class="section">
            <strong>Quem é?</strong>
            <p>${item.testemunho}</p>
          </div>

          <button class="relation-btn" type="button" data-index="${index}">Ver relação com o ebook</button>
        </div>
      `;

      return slide;
    }

    function renderCarousel() {
      testemunhos.forEach((item, index) => {
        track.appendChild(createSlide(item, index));

        const dot = document.createElement("button");
        dot.className = index === 0 ? "dot active" : "dot";
        dot.type = "button";
        dot.setAttribute("aria-label", `Ir para o slide ${index + 1}`);
        dot.addEventListener("click", () => goToSlide(index));
        dots.appendChild(dot);
      });

      updateCarousel();
    }

    function updateCarousel() {
      track.style.transform = `translateX(-${currentIndex * 100}%)`;

      [...track.children].forEach((slide, index) => {
        slide.setAttribute("aria-hidden", index === currentIndex ? "false" : "true");
      });

      [...dots.children].forEach((dot, index) => {
        dot.classList.toggle("active", index === currentIndex);
      });

      counter.textContent = `${currentIndex + 1} / ${testemunhos.length}`;
    }

    function goToSlide(index) {
      currentIndex = (index + testemunhos.length) % testemunhos.length;
      updateCarousel();
    }


    function openRelation(index) {
      const item = testemunhos[index];
      if (!item) return;
      modalTitle.textContent = item.nome;
      modalText.textContent = item.relacao;
      relationModal.classList.add("open");
      relationModal.setAttribute("aria-hidden", "false");
    }

    function closeRelation() {
      relationModal.classList.remove("open");
      relationModal.setAttribute("aria-hidden", "true");
    }

    document.addEventListener("click", (event) => {
      const relationButton = event.target.closest(".relation-btn");
      if (relationButton) {
        openRelation(Number(relationButton.dataset.index));
        return;
      }

      if (event.target === relationModal || event.target === modalClose) {
        closeRelation();
      }
    });

    prevBtn.addEventListener("click", () => goToSlide(currentIndex - 1));
    nextBtn.addEventListener("click", () => goToSlide(currentIndex + 1));

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") closeRelation();
      if (event.key === "ArrowLeft") goToSlide(currentIndex - 1);
      if (event.key === "ArrowRight") goToSlide(currentIndex + 1);
    });

    let touchStartX = 0;
    let touchEndX = 0;

    track.addEventListener("touchstart", (event) => {
      touchStartX = event.changedTouches[0].screenX;
    }, { passive: true });

    track.addEventListener("touchend", (event) => {
      touchEndX = event.changedTouches[0].screenX;
      const diff = touchStartX - touchEndX;

      if (Math.abs(diff) > 45) {
        if (diff > 0) goToSlide(currentIndex + 1);
        else goToSlide(currentIndex - 1);
      }
    }, { passive: true });

    renderCarousel();
  </script>
</body>
