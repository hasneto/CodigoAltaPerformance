<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Primeiras Impressões de Leitores</title>
  <style>
    :root {
      --bg: #191919;
      --card-bg: #111;
      --border: rgba(255, 255, 255, 0.12);
      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.72);
      --accent: #39ff14;
      --button-bg: rgba(0, 0, 0, 0.55);
      --button-bg-hover: rgba(0, 0, 0, 0.78);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      background: var(--bg) !important;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .reader-impressions {
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
      padding: 8px 40px 20px;
      background: var(--bg);
      position: relative;
    }

    .reader-carousel {
      position: relative;
      width: 100%;
      overflow: hidden;
    }

    .reader-track {
      display: flex;
      gap: 14px;
      transition: transform 0.45s ease;
      will-change: transform;
    }

    .reader-item {
      display: block;
      flex: 0 0 calc((100% - 42px) / 4);
      aspect-ratio: 9 / 16;
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      background: var(--card-bg);
      text-decoration: none;
      transform: scale(1);
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .reader-item:hover {
      transform: scale(1.015);
      border-color: rgba(57, 255, 20, 0.45);
      box-shadow: 0 0 18px rgba(57, 255, 20, 0.12);
    }

    .reader-item img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: top center;
    }

    .reader-btn {
      position: absolute;
      top: 50%;
      z-index: 5;
      width: 38px;
      height: 38px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 999px;
      background: var(--button-bg);
      color: var(--text);
      cursor: pointer;
      display: grid;
      place-items: center;
      transform: translateY(-50%);
      transition: background 0.25s ease, border-color 0.25s ease, opacity 0.25s ease;
      font-size: 22px;
      line-height: 1;
    }

    .reader-btn:hover {
      background: var(--button-bg-hover);
      border-color: rgba(57, 255, 20, 0.55);
    }

    .reader-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .reader-btn.prev {
      left: -2px;
    }

    .reader-btn.next {
      right: -2px;
    }

    .reader-dots {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 7px;
      margin-top: 12px;
    }

    .reader-dot {
      width: 8px;
      height: 8px;
      border: 0;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.28);
      cursor: pointer;
      padding: 0;
      transition: width 0.25s ease, background 0.25s ease;
    }

    .reader-dot.active {
      width: 22px;
      background: var(--accent);
    }

    @media (max-width: 900px) {
      .reader-impressions {
        padding: 6px 34px 18px;
      }

      .reader-item {
        flex-basis: calc((100% - 14px) / 2);
      }
    }

    @media (max-width: 760px) {
      html,
      body {
        overflow: hidden;
      }

      .reader-impressions {
        padding: 0 32px 16px;
      }

      .reader-track {
        gap: 10px;
      }

      .reader-item {
        flex: 0 0 82%;
        aspect-ratio: 9 / 16;
        border-radius: 14px;
      }

      .reader-btn {
        width: 32px;
        height: 32px;
        font-size: 19px;
      }

      .reader-btn.prev {
        left: -28px;
      }

      .reader-btn.next {
        right: -28px;
      }
    }

    @media (max-width: 420px) {
      .reader-impressions {
        padding: 0 30px 14px;
      }

      .reader-item {
        flex-basis: 86%;
      }

      .reader-dots {
        margin-top: 9px;
      }
    }
  </style>
</head>
<body>
  <main class="reader-impressions" aria-label="Primeiras impressões de leitores">
    <div class="reader-carousel" id="readerCarousel">
      <div class="reader-track">

        <a class="reader-item" href="https://raw.githubusercontent.com/hasneto/CodigoAltaPerformance/main/comentario1.jpeg?v=1" target="_blank" rel="noopener">
          <img src="https://raw.githubusercontent.com/hasneto/CodigoAltaPerformance/main/comentario1.jpeg?v=1" alt="Comentário de leitor no direct do Instagram 1" loading="lazy" />
        </a>

        <a class="reader-item" href="https://raw.githubusercontent.com/hasneto/CodigoAltaPerformance/main/comentario2.jpeg?v=1" target="_blank" rel="noopener">
          <img src="https://raw.githubusercontent.com/hasneto/CodigoAltaPerformance/main/comentario2.jpeg?v=1" alt="Comentário de leitor no direct do Instagram 2" loading="lazy" />
        </a>

        <a class="reader-item" href="https://raw.githubusercontent.com/hasneto/CodigoAltaPerformance/main/comentario3.jpeg?v=1" target="_blank" rel="noopener">
          <img src="https://raw.githubusercontent.com/hasneto/CodigoAltaPerformance/main/comentario3.jpeg?v=1" alt="Comentário de leitor no direct do Instagram 3" loading="lazy" />
        </a>

        <a class="reader-item" href="https://raw.githubusercontent.com/hasneto/CodigoAltaPerformance/main/comentario4.jpeg?v=1" target="_blank" rel="noopener">
          <img src="https://raw.githubusercontent.com/hasneto/CodigoAltaPerformance/main/comentario4.jpeg?v=1" alt="Comentário de leitor no direct do Instagram 4" loading="lazy" />
        </a>

      </div>

      <button class="reader-btn prev" type="button" aria-label="Comentário anterior">‹</button>
      <button class="reader-btn next" type="button" aria-label="Próximo comentário">›</button>

      <div class="reader-dots" aria-label="Navegação dos comentários"></div>
    </div>
  </main>

  <script>
    (function () {
      const carousel = document.getElementById("readerCarousel");
      const track = carousel.querySelector(".reader-track");
      const items = Array.from(carousel.querySelectorAll(".reader-item"));
      const prevBtn = carousel.querySelector(".prev");
      const nextBtn = carousel.querySelector(".next");
      const dotsContainer = carousel.querySelector(".reader-dots");

      let index = 0;
      let visibleItems = getVisibleItems();
      let maxIndex = Math.max(0, items.length - visibleItems);
      let startX = 0;
      let currentX = 0;
      let isDragging = false;

      function getVisibleItems() {
        if (window.innerWidth <= 760) return 1;
        if (window.innerWidth <= 900) return 2;
        return 4;
      }

      function getGap() {
        const style = window.getComputedStyle(track);
        return parseFloat(style.gap) || 0;
      }

      function getItemWidth() {
        return items[0].getBoundingClientRect().width;
      }

      function updateCarousel() {
        visibleItems = getVisibleItems();
        maxIndex = Math.max(0, items.length - visibleItems);

        if (index > maxIndex) index = maxIndex;
        if (index < 0) index = 0;

        const offset = index * (getItemWidth() + getGap());
        track.style.transform = `translateX(-${offset}px)`;

        prevBtn.disabled = index === 0;
        nextBtn.disabled = index === maxIndex;

        updateDots();
      }

      function createDots() {
        dotsContainer.innerHTML = "";
        const totalDots = maxIndex + 1;

        for (let i = 0; i < totalDots; i++) {
          const dot = document.createElement("button");
          dot.className = "reader-dot";
          dot.type = "button";
          dot.setAttribute("aria-label", `Ir para o comentário ${i + 1}`);
          dot.addEventListener("click", function () {
            index = i;
            updateCarousel();
          });
          dotsContainer.appendChild(dot);
        }

        updateDots();
      }

      function updateDots() {
        const dots = Array.from(dotsContainer.querySelectorAll(".reader-dot"));

        if (dots.length !== maxIndex + 1) {
          createDots();
          return;
        }

        dots.forEach(function (dot, i) {
          dot.classList.toggle("active", i === index);
        });
      }

      prevBtn.addEventListener("click", function () {
        index -= 1;
        updateCarousel();
      });

      nextBtn.addEventListener("click", function () {
        index += 1;
        updateCarousel();
      });

      window.addEventListener("resize", function () {
        visibleItems = getVisibleItems();
        maxIndex = Math.max(0, items.length - visibleItems);
        createDots();
        updateCarousel();
      });

      track.addEventListener("touchstart", function (event) {
        startX = event.touches[0].clientX;
        currentX = startX;
        isDragging = true;
      }, { passive: true });

      track.addEventListener("touchmove", function (event) {
        if (!isDragging) return;
        currentX = event.touches[0].clientX;
      }, { passive: true });

      track.addEventListener("touchend", function () {
        if (!isDragging) return;

        const diff = startX - currentX;

        if (Math.abs(diff) > 45) {
          if (diff > 0 && index < maxIndex) {
            index += 1;
          } else if (diff < 0 && index > 0) {
            index -= 1;
          }
        }

        isDragging = false;
        updateCarousel();
      });

      document.addEventListener("keydown", function (event) {
        if (event.key === "ArrowRight" && index < maxIndex) {
          index += 1;
          updateCarousel();
        }

        if (event.key === "ArrowLeft" && index > 0) {
          index -= 1;
          updateCarousel();
        }
      });

      createDots();
      updateCarousel();
    })();
  </script>
</body>
</html>
