<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prévia do Ebook</title>
  <style>
    :root {
      --bg: #191919;
      --border: rgba(255, 255, 255, 0.10);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      background: var(--bg) !important;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .preview-ebook {
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
      padding: 8px 4px 12px;
      background: var(--bg);
    }

    .preview-grid {
      display: flex;
      gap: 12px;
      width: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      padding: 0 4px 10px;
      scrollbar-width: thin;
    }

    .preview-grid::-webkit-scrollbar {
      height: 8px;
    }

    .preview-grid::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.06);
      border-radius: 999px;
    }

    .preview-grid::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.30);
      border-radius: 999px;
    }

    .preview-grid::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.45);
    }

    .preview-item {
      display: block;
      flex: 0 0 220px;
      aspect-ratio: 3 / 4.35;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      background: #111;
      scroll-snap-align: start;
    }

    .preview-item img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: top center;
    }

    @media (max-width: 760px) {
      .preview-ebook {
        padding: 0 0 10px;
      }

      .preview-grid {
        gap: 8px;
        padding: 0 0 8px;
      }

      .preview-item {
        flex: 0 0 72%;
        aspect-ratio: 3 / 4.1;
        border-radius: 10px;
        scroll-snap-align: center;
      }
    }

    @media (max-width: 420px) {
      .preview-grid {
        gap: 7px;
        padding-bottom: 8px;
      }

      .preview-item {
        flex-basis: 74%;
      }
    }
  </style>
</head>
<body>
  <main class="preview-ebook" aria-label="Prévia do interior do ebook">
    <section class="preview-grid">

      <a class="preview-item" href="https://raw.githubusercontent.com/hasneto/CodigoAltaPerformance/main/1.jpeg?v=2" target="_blank" rel="noopener">
        <img src="https://raw.githubusercontent.com/hasneto/CodigoAltaPerformance/main/1.jpeg?v=2" alt="Capa do ebook Código da Alta Performance" loading="lazy" />
      </a>

      <a class="preview-item" href="https://raw.githubusercontent.com/hasneto/CodigoAltaPerformance/main/2.jpeg?v=2" target="_blank" rel="noopener">
        <img src="https://raw.githubusercontent.com/hasneto/CodigoAltaPerformance/main/2.jpeg?v=2" alt="Página Como usar este ebook" loading="lazy" />
      </a>

      <a class="preview-item" href="https://raw.githubusercontent.com/hasneto/CodigoAltaPerformance/main/3.jpeg?v=2" target="_blank" rel="noopener">
        <img src="https://raw.githubusercontent.com/hasneto/CodigoAltaPerformance/main/3.jpeg?v=2" alt="Índice com aplicações práticas do ebook" loading="lazy" />
      </a>

      <a class="preview-item" href="https://raw.githubusercontent.com/hasneto/CodigoAltaPerformance/main/4.jpeg?v=2" target="_blank" rel="noopener">
        <img src="https://raw.githubusercontent.com/hasneto/CodigoAltaPerformance/main/4.jpeg?v=2" alt="Aplicação prática Protocolo do Foco" loading="lazy" />
      </a>

      <a class="preview-item" href="https://raw.githubusercontent.com/hasneto/CodigoAltaPerformance/main/5.jpeg?v=2" target="_blank" rel="noopener">
        <img src="https://raw.githubusercontent.com/hasneto/CodigoAltaPerformance/main/5.jpeg?v=2" alt="Aplicação prática Protocolo de Execução" loading="lazy" />
      </a>

      <a class="preview-item" href="https://raw.githubusercontent.com/hasneto/CodigoAltaPerformance/main/6.jpeg?v=2" target="_blank" rel="noopener">
        <img src="https://raw.githubusercontent.com/hasneto/CodigoAltaPerformance/main/6.jpeg?v=2" alt="Plano de ação de 21 dias" loading="lazy" />
      </a>

      <a class="preview-item" href="https://raw.githubusercontent.com/hasneto/CodigoAltaPerformance/main/7.jpeg?v=2" target="_blank" rel="noopener">
        <img src="https://raw.githubusercontent.com/hasneto/CodigoAltaPerformance/main/7.jpeg?v=2" alt="Semana 2 do plano de ação de 21 dias" loading="lazy" />
      </a>

      <a class="preview-item" href="https://raw.githubusercontent.com/hasneto/CodigoAltaPerformance/main/8.jpeg?v=2" target="_blank" rel="noopener">
        <img src="https://raw.githubusercontent.com/hasneto/CodigoAltaPerformance/main/8.jpeg?v=2" alt="Semana 3 do plano de ação de 21 dias" loading="lazy" />
      </a>

      <a class="preview-item" href="https://raw.githubusercontent.com/hasneto/CodigoAltaPerformance/main/9.jpeg?v=2" target="_blank" rel="noopener">
        <img src="https://raw.githubusercontent.com/hasneto/CodigoAltaPerformance/main/9.jpeg?v=2" alt="Checklist de Alta Performance" loading="lazy" />
      </a>

    </section>
  </main>
</body>
</html>
