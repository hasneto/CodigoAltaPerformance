<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prévia do Ebook</title>
  <style>
    :root {
      --bg: #191919;
      --border: rgba(255, 255, 255, 0.10);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      background: var(--bg) !important;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .preview-ebook {
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
      padding: 8px;
      background: var(--bg);
    }

    .preview-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
      width: 100%;
    }

    .preview-item {
      display: block;
      width: 100%;
      aspect-ratio: 3 / 4.35;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      background: #111;
    }

    .preview-item img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: top center;
    }

    @media (max-width: 760px) {
      html,
      body {
        overflow: hidden;
      }

      .preview-ebook {
        padding: 0;
      }

      .preview-grid {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        overflow-y: hidden;
        scroll-snap-type: x mandatory;
        -webkit-overflow-scrolling: touch;
        padding: 0 0 4px;
        scrollbar-width: thin;
      }

      .preview-item {
        flex: 0 0 72%;
        aspect-ratio: 3 / 4.1;
        border-radius: 10px;
        scroll-snap-align: center;
      }
    }

    @media (max-width: 420px) {
      .preview-grid {
        gap: 7px;
        padding-bottom: 3px;
      }

      .preview-item {
        flex-basis: 74%;
      }
    }
  </style>
</head>
<body>
  <main class="preview-ebook" aria-label="Prévia do interior do ebook">
    <section class="preview-grid">
      <a class="preview-item" href="https://raw.githubusercontent.com/hasneto/CodigoAltaPerformance/main/capa_indice1.jpeg" target="_blank" rel="noopener">
        <img src="https://raw.githubusercontent.com/hasneto/CodigoAltaPerformance/main/capa_indice1.jpeg" alt="Capa e índice do ebook" loading="lazy" />
      </a>

      <a class="preview-item" href="https://raw.githubusercontent.com/hasneto/CodigoAltaPerformance/main/indice2.jpeg" target="_blank" rel="noopener">
        <img src="https://raw.githubusercontent.com/hasneto/CodigoAltaPerformance/main/indice2.jpeg" alt="Índice do ebook - parte 2" loading="lazy" />
      </a>

      <a class="preview-item" href="https://raw.githubusercontent.com/hasneto/CodigoAltaPerformance/main/indice3.jpeg" target="_blank" rel="noopener">
        <img src="https://raw.githubusercontent.com/hasneto/CodigoAltaPerformance/main/indice3.jpeg" alt="Índice do ebook - parte 3" loading="lazy" />
      </a>

      <a class="preview-item" href="https://raw.githubusercontent.com/hasneto/CodigoAltaPerformance/main/indice4.jpeg" target="_blank" rel="noopener">
        <img src="https://raw.githubusercontent.com/hasneto/CodigoAltaPerformance/main/indice4.jpeg" alt="Índice do ebook - parte 4" loading="lazy" />
      </a>

      <a class="preview-item" href="https://raw.githubusercontent.com/hasneto/CodigoAltaPerformance/main/plano-21-dias.jpeg" target="_blank" rel="noopener">
        <img src="https://raw.githubusercontent.com/hasneto/CodigoAltaPerformance/main/plano-21-dias.jpeg" alt="Plano de 21 dias do ebook" loading="lazy" />
      </a>
    </section>
  </main>
</body>
</html>
